conky.config = {
    alignment = 'top_right',
    gap_x = 22,
    gap_y = 26,

    use_xft = true,
    xftalpha = 0.95,
    font = 'Noto Sans Mono:size=8',
    override_utf8_locale = true,
    uppercase = false,
    use_spacer = 'none',
    text_buffer_size = 4096,

    update_interval = 1.0,
    total_run_times = 0,
    background = false,
    out_to_console = false,
    out_to_x = true,

    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',
    own_window_title = 'conky-system',
    own_window_colour = '#99121319',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    double_buffer = true,

    minimum_width = 260,
    maximum_width = 260,

    draw_borders = false,
    draw_graph_borders = true,
    draw_shades = false,
    draw_outline = true,
    default_outline_color = '000000',

    default_color = 'e8ebf0',
    color1 = 'ffffff',
    color2 = 'ffc98f',
    color3 = '93a1b0',
    color4 = 'aecbe8',
    color5 = 'bfe3cf',
    color6 = 'e6c9a8',
    color7 = '2b3540',
    color8 = 'aecbe8',
    color9 = 'ffb3a0',

    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,
    short_units = true,
    format_human_readable = true,
    show_graph_scale = false,
    show_graph_range = false,
    imlib_cache_size = 0,

    default_bar_width = 150,
    default_bar_height = 8,
    default_gauge_width = 40,
    default_gauge_height = 40,
}

conky.text = [[
${color1}${font Noto Sans Mono:bold:size=11}${alignc}${nodename}${font}${color}
${color3}${goto 8}${time %A, %d %B %Y}${alignr 8}${time %H:%M}${color}
${color1}${hr}${color}

${goto 8}${color1}${font Noto Sans Mono:bold:size=9}CPU${font}${color}${color3}  ${execi 60 grep -m1 'model name' /proc/cpuinfo | sed 's/.*Core(TM) //; s/ CPU.*//'} @ ${freq_g 1}GHz${alignr 8}${execi 5 cat /sys/devices/system/cpu/cpu1/cpufreq/scaling_governor}${color}
${goto 8}${color3}Load ${color}${cpubar cpu0 10,180}${color2} ${cpu cpu0}%${color}
${goto 8}${color7}${cpugraph cpu0 22,244 ffc98f ff9e5e -t}${color}

${goto 8}${color1}${font Noto Sans Mono:bold:size=9}CORES${font}${color}
${goto 8}${color3}1${color}${goto 26}${color2}${cpu cpu1}%${goto 62}${cpubar cpu1 8,50}${color}${goto 136}${color3}5${color}${goto 154}${color2}${cpu cpu5}%${goto 190}${cpubar cpu5 8,50}${color}
${goto 8}${color3}2${color}${goto 26}${color2}${cpu cpu2}%${goto 62}${cpubar cpu2 8,50}${color}${goto 136}${color3}6${color}${goto 154}${color2}${cpu cpu6}%${goto 190}${cpubar cpu6 8,50}${color}
${goto 8}${color3}3${color}${goto 26}${color2}${cpu cpu3}%${goto 62}${cpubar cpu3 8,50}${color}${goto 136}${color3}7${color}${goto 154}${color2}${cpu cpu7}%${goto 190}${cpubar cpu7 8,50}${color}
${goto 8}${color3}4${color}${goto 26}${color2}${cpu cpu4}%${goto 62}${cpubar cpu4 8,50}${color}${goto 136}${color3}8${color}${goto 154}${color2}${cpu cpu8}%${goto 190}${cpubar cpu8 8,50}${color}

${goto 8}${color1}${font Noto Sans Mono:bold:size=9}THERMALS${font}${color}
${execpi 2 sh ~/.config/conky/thermals.sh}

${goto 8}${color1}${font Noto Sans Mono:bold:size=9}PROCESSES${font}${color}
${goto 8}${color2}${top name 1}${alignr 8}${color2}${top cpu 1}%${color}
${goto 8}${color}${top name 2}${alignr 8}${color3}${top cpu 2}%${color}
${goto 8}${color}${top name 3}${alignr 8}${color3}${top cpu 3}%${color}

${color1}${hr}${color}
${goto 8}${color1}${font Noto Sans Mono:bold:size=9}MEMORY${font}${color}
${goto 8}${color3}RAM${color}${goto 44}${membar 10,140}${color2} ${mem}${alignr 8}${memperc}%${color}
${goto 8}${color7}${memgraph 18,244 e6c9a8 ffc98f}${color}
${goto 8}${color3}SWAP${color}${goto 44}${swapbar 8,140}${color2} ${swap}${alignr 8}${swapperc}%${color}
${goto 8}${color2}${top_mem name 1}${alignr 8}${color2}${top mem 1}%${color}
${goto 8}${color}${top_mem name 2}${alignr 8}${color3}${top mem 2}%${color}
${goto 8}${color}${top_mem name 3}${alignr 8}${color3}${top mem 3}%${color}

${color1}${hr}${color}
${goto 8}${color1}${font Noto Sans Mono:bold:size=9}GPU${font}${color}${color3}${alignr 8}${execi 60 nvidia-smi --query-gpu=name --format=csv,noheader | sed 's/NVIDIA //'}${color}
${goto 8}${color3}Driver ${color2}${execi 60 nvidia-smi --query-gpu=driver_version --format=csv,noheader}${alignr 8}${color3}Temp ${color9}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader}°C${color}
${goto 8}${color3}Load ${color}${execibar 2 12,150 "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader | tr -dc 0-9"}${alignr 8}${color2}${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader}${color}
${goto 8}${color7}${execigraph 2 "nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader | tr -dc 0-9" 18,244 ffc98f ff9e5e -t}${color}
${goto 8}${color3}Core ${color}${execi 2 nvidia-smi --query-gpu=clocks.sm --format=csv,noheader | cut -d' ' -f1}MHz${goto 136}${color3}Mem ${color}${execi 2 nvidia-smi --query-gpu=clocks.mem --format=csv,noheader | cut -d' ' -f1}MHz
${goto 8}${color3}VRAM ${color2}${execi 2 nvidia-smi --query-gpu=memory.used --format=csv,noheader}${color3} / ${execi 2 nvidia-smi --query-gpu=memory.total --format=csv,noheader}

${color1}${hr}${color}
${goto 8}${color1}${font Noto Sans Mono:bold:size=9}NETWORK${font}${color}${color3}${alignr 8}${addr wlx9ca2f419c6e3}${color}
${goto 8}${color3}Up ${color5}${upspeed wlx9ca2f419c6e3}${color}${goto 136}${color3}Down ${color4}${downspeed wlx9ca2f419c6e3}${color}
${goto 8}${color3}Tot ${color}${totalup wlx9ca2f419c6e3}${goto 136}${color3}Tot ${color}${totaldown wlx9ca2f419c6e3}
${goto 8}${color7}${upspeedgraph wlx9ca2f419c6e3 18,116 bfe3cf 8fd8b0 -t}${alignr 8}${downspeedgraph wlx9ca2f419c6e3 18,116 aecbe8 8fb4e0 -t}

${color1}${hr}${color}
${goto 8}${color1}${font Noto Sans Mono:bold:size=9}STORAGE${font}${color}
${execpi 30 sh ~/.config/conky/storage.sh}
${goto 8}${color3}Read ${color5}${diskio_read sda}${color}${goto 136}${color3}Write ${color9}${diskio_write sda}${color}
${goto 8}${color7}${diskiograph_read /dev/sda 18,116 bfe3cf 8fd8b0 -l -t}${alignr 8}${diskiograph_write /dev/sda 18,116 ffb3a0 ffc98f -l -t}
]]
